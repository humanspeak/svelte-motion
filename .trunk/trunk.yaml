# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
    version: 1.29.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
    sources:
        - id: trunk
          ref: v1.11.0
          uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
    enabled:
        - go@1.21.0
        - python@3.14.4
        - node@22.22.2
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
    disabled:
        - actionlint
    ignore:
        - linters: [ALL]
          paths:
              - '**/worker-configuration.d.ts'
              - convex/_generated/**
              - .agents/.plans/**
              - .agents/.plans-closed/**
              # shadcn-style registry blobs — generated/curated externally;
              # don't let the formatter rewrite their indent on every run.
              - docs/static/r/**
        - linters: [osv-scanner]
          paths:
              - '**/pnpm-lock.yaml'
        - linters: [markdownlint]
          paths:
              - .changeset/**
    definitions:
        - name: prettier
          files:
              - typescript
              - svelte
              - yaml
              - css
              - postcss
              - sass
              - html
              - markdown
              - json
              - javascript
              - graphql
              - prettier_supported_configs
        - name: eslint
          files:
              - typescript
              - svelte
              - javascript
    enabled:
        - grype@0.121.1
        - sort-package-json@4.1.0
        - checkov@3.4.3
        - eslint@10.14.0
        - git-diff-check
        - markdownlint@0.50.0
        - osv-scanner@2.7.0
        - oxipng@10.2.1
        - prettier@3.9.10
        - shellcheck@0.11.0
        - shfmt@3.14.1
        - svgo@4.1.0
        - taplo@0.10.0
        - trufflehog@3.99.8
        - yamllint@1.38.0
        - zizmor@1.32.0
actions:
    disabled:
        - trunk-announce
        - trunk-check-pre-push
        - trunk-fmt-pre-commit
        - trunk-upgrade-available
tools:
    enabled:
        - oxfmt@0.76.0
