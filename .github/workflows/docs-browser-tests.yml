name: Docs Browser Tests

permissions:
    contents: read

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        branches:
            - main
        paths:
            - docs/**
            - src/**
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
            - svelte.config.*
            - vite.config.*
            - tsconfig*.json
            - .github/workflows/docs-browser-tests.yml
    workflow_dispatch:

concurrency:
    group: docs-browser-tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    browsers:
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            NODE_OPTIONS: --max-old-space-size=4096
        steps:
            - name: Checkout
              uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
              with:
                  persist-credentials: false
                  fetch-depth: 1

            - uses: pnpm/action-setup@v6 # zizmor: ignore[unpinned-uses]

            - name: Use Node.js - 24
              uses: actions/setup-node@v7 # zizmor: ignore[unpinned-uses]
              with:
                  node-version: 24

            - name: Install workspace dependencies
              run: pnpm install --frozen-lockfile --config.engine-strict=false

            - name: Install browser dependencies
              run: pnpm exec playwright install --with-deps chromium firefox

            - name: Test the real docs route
              run: pnpm exec playwright test --config docs/playwright.config.ts

            - name: Retain browser reports and failure traces
              if: always()
              uses: actions/upload-artifact@v7 # zizmor: ignore[unpinned-uses]
              with:
                  name: docs-browser-results
                  path: |
                      test-results/docs/
                      playwright-report/docs/
                  if-no-files-found: ignore
                  retention-days: 7
