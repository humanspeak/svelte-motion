name: Run tests

permissions:
    contents: read

on:
    workflow_call:
    pull_request:
        branches:
            - main
            - '!dependabot/**'
        paths:
            - src/**
            - tests/**
            - e2e/**
            - scripts/chromium-launch-options.ts
            - '!docs/**'
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
            - svelte.config.*
            - vite.config.*
            - vitest.config.*
            - vitest.setup.*
            - playwright.config.*
            - tsconfig*.json
            - .github/workflows/run-tests.yml
            - eslint.config.*
            - .npmrc
            - .github/scripts/**
            - .github/release-policy.json
            - .github/release-source.json

concurrency:
    group: run-tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    unit-tests:
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
              with:
                  persist-credentials: false
                  fetch-depth: 1

            - uses: pnpm/action-setup@v6 # zizmor: ignore[unpinned-uses]

            - name: Use Node.js - 24
              uses: actions/setup-node@v7 # zizmor: ignore[unpinned-uses]
              with:
                  node-version: 24

            - name: Cache build artifacts
              uses: actions/cache@v6 # zizmor: ignore[unpinned-uses]
              with:
                  path: |
                      .svelte-kit
                      dist
                  key: ${{ runner.os }}-build-${{ hashFiles('src/**/*', 'pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-build-

            - name: Cache vitest artifacts
              uses: actions/cache@v6 # zizmor: ignore[unpinned-uses]
              with:
                  path: |
                      node_modules/.vitest
                      test-results
                  key: ${{ runner.os }}-vitest-${{ hashFiles('pnpm-lock.yaml', 'src/**/*.{test,spec}.{js,ts}', 'tests/**/*.{test,spec}.{js,ts}', 'vitest.config.ts') }}
                  restore-keys: |
                      ${{ runner.os }}-vitest-

            - name: Install dependencies
              run: >-
                  pnpm install --filter .
                  --filter @humanspeak/svelte-motion-consumer-vite6
                  --frozen-lockfile --config.engine-strict=false

            - name: Check library types
              run: pnpm run check

            - name: Test release safety offline
              run: node --test .github/scripts/*.test.mjs

            - name: Run unit tests
              run: |
                  pnpm build
                  pnpm test

            - name: Test Vite 6 consumer compatibility
              run: pnpm --filter @humanspeak/svelte-motion-consumer-vite6 test

            - name: Upload unit test results
              if: always()
              uses: actions/upload-artifact@v7 # zizmor: ignore[unpinned-uses]
              with:
                  name: unit-test-results
                  path: |
                      coverage/**
                      test-results/**
                  if-no-files-found: ignore
                  retention-days: 7

    playwright-version:
        name: Resolve Playwright version
        runs-on: blacksmith-2vcpu-ubuntu-2404
        timeout-minutes: 5
        outputs:
            playwright: ${{ steps.resolve.outputs.playwright }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
              with:
                  persist-credentials: false
                  sparse-checkout: package.json
                  sparse-checkout-cone-mode: false

            # The container image must match the installed @playwright/test exactly,
            # so read it from package.json instead of hardcoding a second copy.
            - name: Resolve Playwright version
              id: resolve
              run: |
                  version=$(jq -r '.devDependencies["@playwright/test"]' package.json)
                  if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "::error::@playwright/test must be pinned to an exact version, got '$version'"
                    exit 1
                  fi
                  echo "playwright=$version" >> "$GITHUB_OUTPUT"

            # Fail here, with a clear message, if the image for this version is
            # not published yet.
            - name: Verify the Playwright image exists
              env:
                  VERSION: ${{ steps.resolve.outputs.playwright }}
              run: docker manifest inspect "mcr.microsoft.com/playwright:v${VERSION}-noble" > /dev/null

    e2e-tests:
        name: e2e-tests (${{ matrix.browser }} ${{ matrix.shard }}/3)
        needs: [unit-tests, playwright-version]
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 25
        # Browsers and their system libraries are baked into the image, so the job
        # never downloads browsers or runs apt (the Ubuntu mirrors are flaky: one
        # shard spent its whole 25 minutes fetching apt packages at 95 kB/s).
        container:
            image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.playwright }}-noble
            options: --user 1001
        strategy:
            fail-fast: false
            matrix:
                browser: [chromium, firefox]
                shard: [1, 2, 3]
        steps:
            - name: Checkout
              uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
              with:
                  persist-credentials: false
                  fetch-depth: 1

            - uses: pnpm/action-setup@v6 # zizmor: ignore[unpinned-uses]

            - name: Use Node.js - 24
              uses: actions/setup-node@v7 # zizmor: ignore[unpinned-uses]
              with:
                  node-version: 24

            - name: Install dependencies
              run: pnpm install --filter . --frozen-lockfile --config.engine-strict=false

            - name: Run e2e tests (sharded)
              env:
                  CI: true
              run: >-
                  pnpm exec playwright test --config=playwright.config.ts
                  --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/3 --reporter=line

            - name: Upload Playwright artifacts
              if: always()
              uses: actions/upload-artifact@v7 # zizmor: ignore[unpinned-uses]
              with:
                  name: playwright-artifacts-${{ matrix.browser }}-${{ matrix.shard }}-3
                  path: |
                      playwright-report/**
                      test-results/**
                      blob-report/**
                  if-no-files-found: ignore
                  retention-days: 7
