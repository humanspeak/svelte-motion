name: Docs

permissions:
    contents: read

# Docs CI/CD for motion.svelte.page: build the site once, test that build, and
# deploy it from main only after the tests pass.
#
# Deploys run on push to main rather than pull_request[closed]: GitHub withholds
# secrets (CLOUDFLARE_API_TOKEN etc.) from pull_request events triggered by
# fork PRs — even the merged close event — so deploys silently failed for
# external contributions (first hit: PR #466). Push events always run in the
# base repo with secrets.
on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        branches:
            - main
        paths:
            - docs/**
            - src/**
            - static/**
            - scripts/chromium-launch-options.ts
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
            - svelte.config.*
            - vite.config.*
            - tsconfig*.json
            - .github/workflows/docs.yml
    push:
        branches:
            - main
        paths:
            - docs/**
            - src/**
            - static/**
            - scripts/chromium-launch-options.ts
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
            - svelte.config.*
            - vite.config.*
            - tsconfig*.json
            - .github/workflows/docs.yml
    workflow_dispatch:

concurrency:
    group: docs-${{ github.ref }}
    # Never interrupt a deploy; superseded PR runs can stop.
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    test:
        name: Test site
        if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            NODE_OPTIONS: --max-old-space-size=4096
        steps:
            - name: Checkout
              uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
              with:
                  persist-credentials: false
                  fetch-depth: 1

            - uses: pnpm/action-setup@v6 # zizmor: ignore[unpinned-uses]

            - name: Use Node.js - 24
              uses: actions/setup-node@v7 # zizmor: ignore[unpinned-uses]
              with:
                  node-version: 24

            - name: Install workspace dependencies
              run: pnpm install --frozen-lockfile --config.engine-strict=false

            # The docs site consumes the packaged library from `dist/`.
            - name: Package library
              run: pnpm package

            # Also generates inputs (GitHub stats, registry) the docs typecheck needs.
            - name: Build docs
              run: pnpm --dir docs build

            - name: Check docs
              run: pnpm --dir docs check

            - name: Unit tests
              run: pnpm --dir docs test

            - name: Generated SEO and LLM artifacts
              run: pnpm --dir docs test:geo-seo

            - name: Install browsers
              run: pnpm exec playwright install --with-deps chromium firefox

            - name: Browser tests against the built site
              run: pnpm exec playwright test --config docs/playwright.config.ts

            - name: Retain browser reports and failure traces
              if: always()
              uses: actions/upload-artifact@v7 # zizmor: ignore[unpinned-uses]
              with:
                  name: docs-browser-results
                  path: |
                      test-results/docs/
                      playwright-report/docs/
                  if-no-files-found: ignore
                  retention-days: 7

    deploy:
        name: Deploy
        needs: test
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: docs
        env:
            NODE_OPTIONS: --max-old-space-size=4096
        steps:
            - name: Checkout
              uses: actions/checkout@v7 # zizmor: ignore[unpinned-uses]
              with:
                  persist-credentials: false

            - uses: pnpm/action-setup@v6 # zizmor: ignore[unpinned-uses]

            - name: Use Node.js - 24
              uses: actions/setup-node@v7 # zizmor: ignore[unpinned-uses]
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install workspace dependencies
              run: pnpm install --frozen-lockfile

            - name: Package library
              run: pnpm package

            # `pnpm run deploy` rebuilds in IndexNow mode, then runs `wrangler deploy`.
            - name: Deploy docs
              working-directory: docs
              env:
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  set -euxo pipefail
                  mkdir -p "${HOME}/.config/.wrangler/logs"
                  # Capture the deploy status so the wrangler log tail still prints on failure.
                  set +e
                  pnpm run deploy
                  DEPLOY_EXIT=$?
                  set -e
                  LATEST_LOG=$(ls -1t "${HOME}/.config/.wrangler/logs"/*.log 2>/dev/null | head -n 1 || true)
                  if [ -n "${LATEST_LOG}" ]; then
                    echo "::group::Wrangler log (tail)"
                    tail -n 200 "${LATEST_LOG}" || true
                    echo "::endgroup::"
                  fi
                  exit ${DEPLOY_EXIT}

            - name: Upload Wrangler logs
              if: always()
              uses: actions/upload-artifact@v7 # zizmor: ignore[unpinned-uses]
              with:
                  name: wrangler-logs
                  path: ~/.config/.wrangler/logs/*.log
                  retention-days: 7
